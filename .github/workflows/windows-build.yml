name: Windows build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Generate demo packs and run frontend tests
        run: |
          node scripts/make-test-packs.mjs test-packs
          npm test

      # Rust tests run on Linux: Tauri test executables lack the Windows common-controls
      # manifest and exit with STATUS_ENTRYPOINT_NOT_FOUND on Windows runners.
      - name: Rust type-check
        working-directory: src-tauri
        run: cargo check

      - name: Build installer (NSIS + MSI)
        run: npx tauri build

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe out/
          Copy-Item src-tauri/target/release/bundle/msi/*.msi out/
          # Portable build: the bare executable (uses the WebView2 runtime built into Windows 10/11)
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item src-tauri/target/release/onxymc-showcase.exe "portable/OnxyMc Texture Pack Showcase.exe"
          Compress-Archive -Path portable/* -DestinationPath "out/OnxyMc-Showcase-portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: OnxyMc-Showcase-Windows
          path: out/*
