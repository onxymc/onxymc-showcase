[package]
name = "onxymc-showcase"
version = "1.0.1"
description = "OnxyMc Texture Pack Showcase"
authors = ["OnxyMc"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "onxymc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
